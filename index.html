<!DOCTYPE html>
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Monthly Grid</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="planner">
      <!-- Header -->
      <header class="planner-header">
        <div class="planner-title">
          <span id="monthLabel"> December 2026 </span>
        </div>

        <div class="planner-nav">
          <button id="todayBtn" class="today-btn">
            <i data-lucide="calendar-days"></i>
          </button>
          <button id="prevMonth" class="nav-btn">
            <i data-lucide="circle-chevron-left"></i>
          </button>
          <button id="nextMonth" class="nav-btn">
            <i data-lucide="circle-chevron-right"></i>
          </button>
        </div>
      </header>
      <!-- Weekday Names -->
      <section class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </section>

      <!-- Calendar Grid -->
      <!-- Monthly Calendar -->
      <section id="calendarGrid" class="calendar-grid"></section>

      <!-- Day Modal -->
      <div id="dayModal" class="day-modal">
        <div class="day-sheet">
          <div class="day-header">
            <div class="journal-date-group">
              <div id="modalDay"></div>

              <div id="modalWeekday"></div>

              <div id="modalSubDate"></div>
            </div>

            <button id="closeModal">✕</button>
          </div>

          <div class="journal-divider"></div>
          <div class="day-content">
            <textarea
              id="dayNote"
              maxlength="250"
              placeholder="Write something..."
            ></textarea>
          </div>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="script.js"></script>
  </body>
</html>
